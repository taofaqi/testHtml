<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <!--禁止浏览器在本地计算机缓存当前页面-->
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta name="author" content="天天拍车">
    <meta name="keywords" content="二手车,二手车交易市场,卖车,二手车评估,二手车估价,二手车买卖,二手车帮卖,天天拍车二手车">
    <meta name="description" content="天天拍车,中国领先的二手车交易平台,免费上门检测,上千家车商竞价,确保卖车最高价,极速打款15分钟搞定,卖车卖出新体验！详询拨打10108885">
    <title>摄像头拍照示例</title>
</head>

<body>
    <div id="errorMessage"></div>
    <video id="video" width="640" height="480" autoplay></video>
    <button id="start-camera">启动摄像头</button>
    <button id="take-photo" disabled>拍照</button>
    <canvas id="canvas" width="640" height="480"></canvas>
    <script>
        // 获取页面元素
        const errorMessage = document.getElementById('errorMessage');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const startCameraBtn = document.getElementById('start-camera');
        const takePhotoBtn = document.getElementById('take-photo');

        // 启动摄像头函数
        startCameraBtn.addEventListener('click', function () {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function (stream) {
                    video.srcObject = stream;
                    takePhotoBtn.disabled = false;
                })
                .catch(function (err) {
                    errorMessage.innerHTML = '摄像头启动错误: ' + JSON.stringify(err);
                    console.error('摄像头启动错误:', err);
                });
        });

        // 拍照函数
        takePhotoBtn.addEventListener('click', function () {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
        });

    </script>

</body>

</html>
